version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: internvision_postgres
    environment:
      POSTGRES_DB: internvision_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: internvision_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/internvision_db
      CASHFREE_APP_ID: TEST_CF_APP_ID_DEMO
      CASHFREE_SECRET_KEY: TEST_CF_SECRET_KEY_DEMO
      CASHFREE_ENVIRONMENT: sandbox
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: internvision_frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
