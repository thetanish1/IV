<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="di-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#F36A06" />
    </linearGradient>
    <linearGradient id="di-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0083CA" />
      <stop offset="100%" stop-color="#004B87" />
    </linearGradient>
    <linearGradient id="di-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0E6306" />
    </linearGradient>
    <filter id="di-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Icon Emblem: Digital Globe + Tri-color Rays -->
  <g transform="translate(15, 10)">
    <!-- Circuit Base Circles -->
    <circle cx="50" cy="50" r="46" fill="#0A1128" stroke="#1E293B" stroke-width="2"/>
    <circle cx="50" cy="50" r="38" stroke="url(#di-blue-grad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
    
    <!-- Stylized 'D' and 'I' Leaves (Tricolor Flow) -->
    <!-- Orange top petal -->
    <path d="M50 16 C68 16 82 30 82 48 C72 48 62 42 56 32 C52 24 50 16 50 16Z" fill="url(#di-orange-grad)"/>
    <!-- Blue Center Tech Wave / Globe -->
    <circle cx="50" cy="50" r="18" fill="url(#di-blue-grad)"/>
    <ellipse cx="50" cy="50" rx="8" ry="18" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="32" y1="50" x2="68" y2="50" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    
    <!-- Green bottom petal -->
    <path d="M50 84 C32 84 18 70 18 52 C28 52 38 58 44 68 C48 76 50 84 50 84Z" fill="url(#di-green-grad)"/>
    
    <!-- Tech Nodes / Circuit Dots -->
    <circle cx="50" cy="50" r="4" fill="#FFFFFF"/>
    <circle cx="78" cy="30" r="2.5" fill="#FF9933"/>
    <circle cx="22" cy="70" r="2.5" fill="#138808"/>
    <circle cx="75" cy="65" r="2" fill="#0083CA"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 20)">
    <!-- Digital (Bold Blue / Cyan Gradient) -->
    <text x="0" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Digital <tspan fill="url(#di-orange-grad)">India</tspan>
    </text>
    <!-- Tagline: Power To Empower -->
    <text x="2" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="2.8" text-transform="uppercase">
      Power To Empower
    </text>
    <!-- Sub-tagline Govt. of India Initiative -->
    <text x="2" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#0284C7" letter-spacing="1">
      GOVERNMENT OF INDIA INITIATIVE
    </text>
  </g>
</svg>
