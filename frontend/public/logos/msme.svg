<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="msme-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="msme-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="msme-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Left Emblem: Industrial Gear & Tricolor Growth Flame -->
  <g transform="translate(15, 10)">
    <!-- Shield Container -->
    <rect x="6" y="6" width="88" height="88" rx="20" fill="#0B132B" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Outer Gear Tooth Ring -->
    <g transform="translate(50, 50)" fill="none" stroke="#F59E0B" stroke-width="2.5" opacity="0.8">
      <circle cx="0" cy="0" r="28" stroke-dasharray="8 6"/>
      <circle cx="0" cy="0" r="22" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
    </g>

    <!-- Center Ashoka / Tricolor Growth Swirl -->
    <g transform="translate(50, 50)">
      <!-- Flame 1 (Orange) -->
      <path d="M-8 -6 C-4 -20 8 -22 10 -10 C12 0 -2 8 -8 -6Z" fill="url(#msme-orange)"/>
      <!-- Flame 2 (White/Silver) -->
      <path d="M-12 4 C-16 -8 -4 -16 2 -6 C6 2 -4 12 -12 4Z" fill="#F8FAFC" opacity="0.9"/>
      <!-- Flame 3 (Green) -->
      <path d="M-6 12 C-14 8 -8 -2 2 4 C8 8 2 18 -6 12Z" fill="#16A34A"/>
      <!-- Central Growth Node -->
      <circle cx="0" cy="0" r="4.5" fill="#3B82F6"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 18)">
    <!-- Hindi Subtitle -->
    <text x="0" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" letter-spacing="0.5">
      सूक्ष्म, लघु एवं मध्यम उद्यम
    </text>
    <!-- MSME English Header -->
    <text x="0" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      MSME
    </text>
    <text x="132" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F59E0B" letter-spacing="0.5">
      UDYAM RECOGNIZED
    </text>
    <!-- English Description -->
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.8">
      MINISTRY OF MICRO, SMALL &amp; MEDIUM ENTERPRISES
    </text>
  </g>
</svg>
