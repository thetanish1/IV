<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="aicte-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="aicte-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="aicte-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- Left Emblem: AICTE Knowledge Lamp & Lotus Arch -->
  <g transform="translate(15, 10)">
    <!-- Container -->
    <rect x="6" y="6" width="88" height="88" rx="20" fill="#0C1322" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Outer Sacred Circle / Sun Rays -->
    <circle cx="50" cy="50" r="36" fill="none" stroke="url(#aicte-gold)" stroke-width="1.8" stroke-dasharray="3 3"/>
    <circle cx="50" cy="50" r="30" fill="#1E1B4B" opacity="0.6"/>

    <!-- Knowledge Lamp (Diya) & Flame -->
    <g transform="translate(50, 52)">
      <!-- Base of Lamp -->
      <path d="M-18 6 C-14 16 14 16 18 6 C12 10 -12 10 -18 6Z" fill="url(#aicte-gold)"/>
      <path d="M-12 10 L-6 18 L6 18 L12 10 Z" fill="#B45309"/>
      <!-- Lamp Flame (Knowledge / Jyoti) -->
      <path d="M0 -22 C-8 -10 -8 -2 0 4 C8 -2 8 -10 0 -22Z" fill="url(#aicte-crimson)"/>
      <path d="M0 -16 C-4 -8 -4 -2 0 2 C4 -2 4 -8 0 -16Z" fill="#FEF08A"/>
      <!-- Open Book / Wings of Education -->
      <path d="M-22 4 C-12 0 -2 2 0 6 C2 2 12 0 22 4 C14 8 2 6 0 8 C-2 6 -14 8 -22 4Z" fill="#F8FAFC" opacity="0.95"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 18)">
    <!-- Hindi Subtitle -->
    <text x="0" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" letter-spacing="0.5">
      अखिल भारतीय तकनीकी शिक्षा परिषद
    </text>
    <!-- AICTE Header -->
    <text x="0" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      AICTE
    </text>
    <text x="135" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="0.5">
      CURRICULUM ALIGNED
    </text>
    <!-- English Description -->
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.8">
      ALL INDIA COUNCIL FOR TECHNICAL EDUCATION
    </text>
  </g>
</svg>
